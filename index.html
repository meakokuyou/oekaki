<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>おえかきアトリエ</title>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#fbe3ea">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="アトリエ">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
/* HELLO WORLD のレイのroomと同じ文法: 192x96 のドットのお部屋+木の枠+上のタブ。色はパステル */
:root{--ink:#3d3340; --wt:#5e4c3f; --wd:#a8998a; --w1:#fffdf9; --line:#ece3d5;
  --pink:#f7c6d4; --pinkD:#e79bb3; --mint:#bfead9; --mintD:#8fd3bb; --lav:#d8c8f2; --lavD:#b29de0; --sky:#c4e5f4; --skyD:#8fc8e6; --lemon:#fbeaa0; --lemonD:#ecc95f}
*{box-sizing:border-box; margin:0; padding:0}
body{font-family:"DotGothic16","MS Gothic","Osaka-Mono",monospace; font-size:15px; line-height:1.7; letter-spacing:.03em; color:var(--wt);
  background:conic-gradient(#f6f1ee 25%, #eee7e3 0 50%, #f6f1ee 0 75%, #eee7e3 0) 0 0/24px 24px; min-height:100vh; overflow-x:hidden}
button,input,select{font:inherit; color:inherit}
.wrap{max-width:1040px; margin:0 auto; padding:max(18px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 70px max(16px, env(safe-area-inset-left))}
button{touch-action:manipulation}
@media (max-width:560px){ header h1{font-size:24px} .wrap{padding-top:max(12px, env(safe-area-inset-top))} .single{font-size:22px} .slot .val{font-size:18px} }
.notch{clip-path:polygon(0 6px,3px 6px,3px 3px,6px 3px,6px 0,calc(100% - 6px) 0,calc(100% - 6px) 3px,calc(100% - 3px) 3px,calc(100% - 3px) 6px,100% 6px,100% calc(100% - 6px),calc(100% - 3px) calc(100% - 6px),calc(100% - 3px) calc(100% - 3px),calc(100% - 6px) calc(100% - 3px),calc(100% - 6px) 100%,6px 100%,6px calc(100% - 3px),3px calc(100% - 3px),3px calc(100% - 6px),0 calc(100% - 6px))}
header{display:flex; align-items:flex-end; justify-content:space-between; gap:12px; margin-bottom:14px; flex-wrap:wrap}
header h1{font-size:30px; font-weight:normal; line-height:1; display:flex; letter-spacing:.1em}
header h1 span{border:3px solid var(--ink); padding:6px 10px}
header h1 .a{background:var(--pink); color:var(--wt); border-right:0}
header h1 .b{background:var(--w1); color:var(--wt)}
header .sub{font-size:13px; color:var(--wd); margin-top:8px}

/* 部屋の上のタブ */
.rooms{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); border:3px solid var(--ink); border-bottom:0}
.rooms button{font-size:16px; padding:8px 0 6px; cursor:pointer; border:0; letter-spacing:.06em; background:#e9e1dc; color:#a39388}
.rooms button + button{border-left:3px solid var(--ink)}
.rooms button.on{background:var(--w1); color:var(--wt)}
.rooms button[data-mode=single].on{box-shadow:inset 0 -4px 0 var(--pinkD)}
.rooms button[data-mode=genre].on{box-shadow:inset 0 -4px 0 var(--lavD)}
.rooms button[data-mode=free].on{box-shadow:inset 0 -4px 0 var(--mintD)}
.rooms .s{display:none}
@media (max-width:560px){ .rooms button{font-size:14px} .rooms .l{display:none} .rooms .s{display:inline} }
.device{background:#ecdfcb; padding:12px; border:3px solid var(--ink); border-top:0; box-shadow:inset -5px -6px 0 #dccbb2, inset 5px 5px 0 #f6eee1}
.screen{position:relative; border:4px solid var(--ink); line-height:0; overflow:hidden}
#room{width:100%; aspect-ratio:192/96; image-rendering:pixelated; image-rendering:crisp-edges; display:block; cursor:pointer}
#bub{position:absolute; transform:translate(-50%, -100%); background:#fff; color:var(--wt); border:2px solid var(--ink); padding:3px 11px; font-size:15px; line-height:1.5;
  white-space:pre-wrap; max-width:60%; width:max-content; pointer-events:none; opacity:0; transition:opacity .25s}
#bub.on{opacity:1}
.bgm{font-size:12px; border:2px solid var(--ink); background:#fbf6f1; padding:0 8px; cursor:pointer; box-shadow:inset -2px -2px 0 #e8dfd0}
.bgm.on{background:var(--lemon); box-shadow:inset -2px -2px 0 var(--lemonD)}
.status{display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; font-size:13px; margin-top:8px}

/* 下のカード */
.grid{display:grid; grid-template-columns:minmax(0,1.25fr) minmax(0,1fr); gap:16px; margin-top:18px; align-items:start}
@media (max-width:780px){ .grid{grid-template-columns:minmax(0,1fr)} }
.card{background:var(--w1); border:3px solid var(--ink); padding:14px 16px; margin-bottom:16px; box-shadow:inset -4px -5px 0 #efe6dc}
.card h2{font-size:14px; font-weight:normal; color:var(--wd); margin-bottom:8px; letter-spacing:.1em}
.chips{display:flex; gap:6px; flex-wrap:wrap}
.chip{border:2px solid var(--ink); background:#fbf6f1; padding:3px 12px; cursor:pointer; font-size:14px; box-shadow:inset -2px -3px 0 #e8dfd0}
.chip.on{background:var(--lav); box-shadow:inset -2px -3px 0 var(--lavD)}
.chip.box.on{background:var(--mint); box-shadow:inset -2px -3px 0 var(--mintD)}
.big{display:block; width:100%; margin-top:12px; border:3px solid var(--ink); background:var(--pink); padding:10px; font-size:20px; cursor:pointer;
  box-shadow:inset -5px -6px 0 var(--pinkD), inset 4px 4px 0 #fbdbe5; letter-spacing:.2em}
.big:active{transform:translateY(2px)}
.single{font-size:26px; text-align:center; padding:20px 6px; min-height:110px; display:flex; align-items:center; justify-content:center; line-height:1.5}
.slot{display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:2px dotted var(--line)}
.slot:last-child{border-bottom:0}
.slot .name{width:5.6em; flex-shrink:0; font-size:12px; text-align:center; border:2px solid var(--ink); padding:0 4px; background:var(--lemon)}
.slot .val{flex:1; font-size:21px; word-break:break-word; line-height:1.4}
.ib{border:2px solid var(--ink); background:#fbf6f1; width:34px; height:32px; cursor:pointer; box-shadow:inset -2px -3px 0 #e8dfd0; font-size:14px}
.ib.locked{background:var(--lemon); box-shadow:inset -2px -3px 0 var(--lemonD)}
.genreNow{text-align:center; font-size:13px; color:var(--wd); margin-bottom:4px}
.row{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:10px}
.small{border:2px solid var(--ink); background:#fbf6f1; padding:3px 12px; cursor:pointer; font-size:13px; box-shadow:inset -2px -3px 0 #e8dfd0}
.hint{font-size:12px; color:var(--wd)}
details summary{cursor:pointer; font-size:14px; letter-spacing:.06em}
ul.hist{list-style:none; margin-top:8px; font-size:13px}
ul.hist li{padding:5px 0; border-bottom:2px dotted var(--line)}
select,input[type=text]{border:2px solid var(--ink); background:#fff; padding:5px 8px; font-size:14px}
input[type=text]{flex:1; min-width:160px}
.items{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px}
.item{border:2px solid var(--ink); background:#fbf6f1; padding:1px 4px 1px 10px; font-size:13px; display:flex; align-items:center; gap:2px}
.item button{border:0; background:none; cursor:pointer; color:var(--wd); padding:0 4px}
.toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--w1); border:3px solid var(--ink); padding:4px 16px; opacity:0; transition:opacity .25s; pointer-events:none; z-index:9}
.toast.show{opacity:1}
.hide{display:none !important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1><span class="a">おえかき</span><span class="b">アトリエ</span></h1>
      <div class="sub">お絵かきサークルのお題ガチャ ・ お部屋を押すと、キャラがよろこぶ</div>
    </div>
  </header>

  <div class="rooms" id="tabs">
    <button data-mode="single" class="on"><span class="l">会のテーマ</span><span class="s">テーマ</span></button>
    <button data-mode="genre"><span class="l">かけあわせ(ジャンル)</span><span class="s">ジャンル</span></button>
    <button data-mode="free"><span class="l">かけあわせ(フリー)</span><span class="s">フリー</span></button>
  </div>
  <div class="device">
    <div class="screen"><canvas id="room" width="192" height="96"></canvas><div id="bub"></div></div>
    <div class="status"><span id="stLeft"></span><span><button class="bgm" id="bgmBtn" title="BGM">♪ BGM OFF</button> <span id="stRight"></span></span></div>
  </div>

  <div class="grid">
    <div>
      <div id="view-single" class="card notch">
        <h2>♪ きょうの会のテーマ</h2>
        <div class="single" id="singleVal">「ひく!」を押してね</div>
        <button class="big" id="singleBtn">ひく!</button>
        <div class="row"><button class="small" id="copy1">📋 LINE用にコピー</button></div>
      </div>
      <div id="view-mix" class="card notch hide">
        <div class="genreNow" id="genreNow"></div>
        <div id="slots"></div>
        <button class="big" id="mixBtn">ひく!</button>
        <div class="row"><button class="small" id="copy2">📋 LINE用にコピー</button><span class="hint">🎲=その箱だけひき直す 🔒=固定</span></div>
      </div>
    </div>
    <div>
      <div class="card notch hide" id="genreCard">
        <h2>♪ ジャンル(窓の外が変わるよ)</h2>
        <div class="chips" id="genreChips"></div>
        <div class="row"><button class="small" id="genreRandom">🎲 ジャンルもおまかせ</button></div>
      </div>
      <div class="card notch hide" id="boxCard">
        <h2>♪ つかう箱(いくつでも)</h2>
        <div class="chips" id="boxChips"></div>
      </div>
      <div class="card notch">
        <details>
          <summary>📜 りれき</summary>
          <ul class="hist" id="hist"></ul>
          <div class="row"><button class="small" id="histClear">りれきを消す</button></div>
        </details>
      </div>
      <div class="card notch" id="editCard">
        <details>
          <summary>✏️ お題をふやす・へらす</summary>
          <div class="row"><select id="edBox"></select><select id="edGenre"></select></div>
          <div class="row"><input type="text" id="edText" placeholder="あたらしいお題"><button class="small" id="edAdd">ついか</button></div>
          <div class="hint" style="margin-top:6px">キャラを足すと、名前から自動でドット絵の見た目が決まります</div>
          <div class="items" id="edItems"></div>
          <div class="row" style="margin-top:14px">
            <button class="small" id="exportBtn">💾 バックアップ保存</button>
            <button class="small" id="importBtn">📂 バックアップ読込</button>
            <input type="file" id="importFile" accept=".json" class="hide">
            <button class="small" id="resetBtn">↩ はじめに戻す</button>
          </div>
        </details>
      </div>
    </div>
  </div>
</div>
<div class="toast notch" id="toast"></div>

<script>
"use strict";
/* ========== お題データ ========== */
const GENRES = [
  {id:"fantasy",name:"ファンタジー"},{id:"school",name:"学園"},{id:"cyber",name:"サイバー"},
  {id:"wa",name:"和風"},{id:"horror",name:"ホラー"},{id:"daily",name:"日常"}
];
const BOXES = [
  {id:"chara",name:"キャラ"},{id:"scene",name:"場面"},{id:"situation",name:"状況"},
  {id:"episode",name:"エピソード"},{id:"rule",name:"縛り"},{id:"sweets",name:"スイーツ"}
];
const SINGLE_ID = "single";
function pack(o){ const r=[]; for(const g in o) for(const t of o[g]) r.push({t,g}); return r; }
const DEFAULTS = {
  single:[
    "オリジナルキャラを描こう","各自でオリキャラを描き合う(メンバーのキャラを自分の絵柄で)",
    "同じキャラをみんなで別々の角度から描く","リレーお絵かき(描き足していく)",
    "同じお題でみんなで描いて見比べ","1分クロッキー大会","自分を動物にしたら?",
    "自分をモンスターにしたら?","好きな食べ物を擬人化","季節の一枚",
    "好きな色だけで描く","線画を交換して色塗り","10年後の自分","夢で見た景色",
    "好きな曲のイメージを描く","架空の生き物図鑑","住んでみたい部屋",
    "オリキャラの私服コーデ","誰かが描いた背景にキャラを置く","落書きから物語を作る"
  ],
  items:{
    chara:pack({
      all:["猫耳の子","双子","無口な大男","小さなおじいさん","元気な女の子","ロボット","動物の擬人化"],
      fantasy:["見習い魔法使い","竜騎士","エルフの弓使い","呪われた王子","宿屋の看板娘"],
      school:["生徒会長","転校生","保健室の先生","帰宅部のエース","美術部員"],
      cyber:["ハッカー","義手の傭兵","AIアイドル","ドローン配達員","闇医者"],
      wa:["狐の妖怪","巫女","浪人の侍","茶屋の娘","忍者"],
      horror:["吸血鬼","動く人形","幽霊の少女","ゾンビの執事","怪しい占い師"],
      daily:["カフェ店員","新米ママ","郵便屋さん","寝不足の会社員","花屋さん"]
    }),
    scene:pack({
      all:["雨の日","夕焼け","夜明け前","雪の日","満月の夜"],
      fantasy:["魔法学校の図書館","森の奥の泉","空に浮かぶ城","ダンジョンの最深部"],
      school:["放課後の教室","屋上","体育祭","文化祭の準備中","卒業式"],
      cyber:["ネオン街の路地裏","高層ビルの屋上","地下のジャンク屋","電脳空間"],
      wa:["夏祭り","竹林","神社の境内","桜並木","縁側"],
      horror:["廃病院","古い洋館","霧の墓地","誰もいない遊園地"],
      daily:["コンビニ","自分の部屋","公園のベンチ","電車の中","キッチン"]
    }),
    situation:pack({
      all:["迷子になった","告白される直前","寝坊した","大雨に降られた","秘密がバレた","大切なものを落とした","誰かを待っている"],
      fantasy:["魔法が暴発した","伝説の剣を抜いてしまった"],
      school:["テスト前日","席替えで隣になった"],
      cyber:["システムがハッキングされた","記憶データが消えた"],
      wa:["狐に化かされた","祭りではぐれた"],
      horror:["後ろに何かいる","鏡に映らない"],
      daily:["財布を忘れた","宅配便が届いた"]
    }),
    episode:pack({
      all:["久しぶりの再会","はじめての友達","別れの日","ケンカして仲直り","誕生日のサプライズ","約束を守った日"],
      fantasy:["旅立ちの朝","魔王との最後の会話"],
      school:["部活の引退試合","片思いの相手と下校"],
      cyber:["人間になりたいAI","最後のバックアップ"],
      wa:["百年ぶりに目覚めた","願いを叶える代償"],
      horror:["呪いが解けた日","帰ってこない友達"],
      daily:["引っ越しの日","初めての料理"]
    }),
    rule:pack({
      all:["3色だけ","線画のみ","10分で描く","利き手と逆の手","丸と四角だけで描く","後ろ姿で描く","横顔で描く",
           "上から見下ろす角度","下から見上げる角度","全身を描く","表情をアップで","背景も描く","モノクロ",
           "ちびキャラで","目をつぶって30秒","好きな色を1色必ず使う"]
    }),
    sweets:pack({
      all:["いちごショート","マカロン","パフェ","ドーナツ","プリン","クレープ","チョコレート","アイスクリーム","パンケーキ"],
      fantasy:["魔法のクッキー","星のキャンディ"],
      school:["購買のメロンパン","学食のプリン"],
      cyber:["光るゼリー","宇宙食アイス"],
      wa:["みたらし団子","かき氷","練り切り","たい焼き"],
      horror:["目玉グミ","真っ黒なケーキ"],
      daily:["コンビニスイーツ","ホットケーキ"]
    })
  }
};

/* ========== ドット絵 ========== */
const P = {ink:"#5a4a5e", pink:"#f7c6d4", pinkD:"#e79bb3", mint:"#bfead9", mintD:"#8fd3bb", lav:"#d8c8f2", lavD:"#b29de0",
  sky:"#c4e5f4", skyD:"#8fc8e6", lemon:"#fbeaa0", lemonD:"#ecc95f", peach:"#fdd5b8", peachD:"#f2ad85", white:"#fffdf9",
  whiteD:"#e6dccb", gray:"#dedee8", grayD:"#a9a9bd", red:"#f29b9b", brown:"#c9a27e", navy:"#8a90bd", cheek:"#f5a3b5"};
const BODY = {pink:["pink","pinkD"], mint:["mint","mintD"], lav:["lav","lavD"], sky:["sky","skyD"], lemon:["lemon","lemonD"],
  peach:["peach","peachD"], white:["white","whiteD"], gray:["gray","grayD"]};
/* キャラごとの見た目。c=体の色 / ears / head=頭のもの / item=持ち物 / 他は飾り */
const LOOKS = {
  "猫耳の子":{c:"pink", ears:"cat", head:"ribbon"}, "双子":{c:"peach", head:"ribbon", twins:1},
  "無口な大男":{c:"gray", mouth:"none", head:"band"}, "小さなおじいさん":{c:"white", beard:1, sleepy:1},
  "元気な女の子":{c:"lemon", head:"ribbon", happy:1}, "ロボット":{c:"gray", head:"antenna", visor:1},
  "動物の擬人化":{c:"peach", ears:"bunny"},
  "見習い魔法使い":{c:"lav", head:"witch", item:"staff"}, "竜騎士":{c:"sky", head:"helmet", item:"sword", wings:1},
  "エルフの弓使い":{c:"mint", ears:"elf", item:"bow"}, "呪われた王子":{c:"lav", head:"crown", mouth:"none"},
  "宿屋の看板娘":{c:"peach", head:"ribbon", apron:1, item:"cup"},
  "生徒会長":{c:"sky", glasses:1, item:"book"}, "転校生":{c:"mint", bag:1, item:"letter"},
  "保健室の先生":{c:"white", glasses:1, badge:1}, "帰宅部のエース":{c:"lemon", head:"cap", bag:1, happy:1},
  "美術部員":{c:"pink", head:"beret", item:"brush"},
  "ハッカー":{c:"gray", head:"hood", item:"laptop"}, "義手の傭兵":{c:"sky", head:"band", item:"arm"},
  "AIアイドル":{c:"pink", head:"antenna", item:"mic", happy:1}, "ドローン配達員":{c:"lemon", head:"phones", item:"box"},
  "闇医者":{c:"gray", glasses:1, badge:1, mouth:"none"},
  "狐の妖怪":{c:"lemon", ears:"fox", tail:1}, "巫女":{c:"white", head:"flower", hakama:1},
  "浪人の侍":{c:"gray", head:"topknot", item:"sword"}, "茶屋の娘":{c:"pink", head:"flower", item:"cup"},
  "忍者":{c:"lav", head:"band", mask:1},
  "吸血鬼":{c:"lav", cape:1, fang:1}, "動く人形":{c:"peach", head:"ribbon", stitch:1, mouth:"none"},
  "幽霊の少女":{c:"white", ghost:1, head:"ribbon"}, "ゾンビの執事":{c:"mint", bandage:1, bowtie:1, sleepy:1},
  "怪しい占い師":{c:"lav", head:"hood", item:"orb"},
  "カフェ店員":{c:"peach", apron:1, item:"cup"}, "新米ママ":{c:"pink", item:"baby", happy:1},
  "郵便屋さん":{c:"sky", head:"cap", bag:1, item:"letter"}, "寝不足の会社員":{c:"gray", sleepy:1, item:"cup"},
  "花屋さん":{c:"mint", apron:1, item:"flower"}
};
function hash(s){ let h=2166136261; for(const ch of s){ h^=ch.codePointAt(0); h=Math.imul(h,16777619); } return h>>>0; }
function lookOf(name){
  if(LOOKS[name]) return LOOKS[name];
  const h=hash(name), cs=Object.keys(BODY), heads=[null,"ribbon","beret","cap","crown","witch","antenna","flower","phones","hood","band"],
    items=[null,"staff","sword","cup","letter","book","flower","mic","box","orb","brush"], ears=[null,null,"cat","bunny","fox","elf"];
  return {c:cs[h%cs.length], head:heads[(h>>>4)%heads.length], item:items[(h>>>9)%items.length], ears:ears[(h>>>14)%ears.length], happy:(h>>>18)%2};
}

function sprite(L, f){
  const W=20,H=20,g=Array.from({length:H},()=>Array(W).fill(null));
  const set=(x,y,c)=>{ if(x>=0&&x<W&&y>=0&&y<H) g[y][x]=P[c]||c; };
  const hl=(x0,x1,y,c)=>{ for(let x=x0;x<=x1;x++) set(x,y,c); };

function starSprite(f){

    const m=new Set(); spans.forEach(([y,a,b])=>{ for(let x=a;x<=b;x++) m.add((y+dy)*100+x); });
    const has=(x,y)=>m.has(y*100+x);
    m.forEach(k=>{ const x=k%100, y=(k-x)/100; [[1,0],[-1,0],[0,1],[0,-1]].forEach(([u,v])=>{ if(!has(x+u,y+v)) put(x+u,y+v,LINE); }); });

/* ========== 住人 ========== */
const mk=(name,x)=>({name, x, dir:1, pause:0, jump:0, happy:0, blink:0});
const mascot=mk(STAR_NAME,60);
let guest=null;
function guestName(){ return mode!=="single" && activeBoxes.has("chara") && current.chara ? current.chara : null; }
function syncGuest(){
  const n=guestName();
  if(!n){ guest=null; return; }
  if(!guest || guest.name!==n){ guest=mk(n, 150); guest.dir=-1; guest.jump=1.2; guest.happy=2; sparkle(guest,8); }
}
const actors=()=>guest?[mascot,guest]:[mascot];
const width=a=>a===mascot?28:lookOf(a.name).twins?34:20;
let parts=[];
function sparkle(a,n){ for(let i=0;i<n;i++) parts.push({k:i%3?"s":"h", x:a.x+6+Math.random()*10, y:FLOOR-18-Math.random()*4, vx:(Math.random()-.5)*14, vy:-8-Math.random()*10, life:1+Math.random()*.6}); }
function celebrate(a){ (a?[a]:actors()).forEach(x=>{ x.jump=.6; x.happy=1.8; x.pause=1; sparkle(x,6); }); }
const LINES_M=["きょうは、なにかく?","いい色だね","ゆっくりでいいよ","みんなの絵、たのしみ","ひいてみる?","きらきら〜"];
const LINES_G=n=>[n+"だよ。よろしくね","かわいくかいてね","どの角度からかく?","まってたよ!"];
function say(a,text){
  const b=$("bub"); b.textContent=text;
  b.style.left=((a.x+width(a)/2)/RW*100)+"%"; b.style.top=((FLOOR-22)/RH*100)+"%"; b.classList.add("on");
  clearTimeout(say.h); say.h=setTimeout(()=>b.classList.remove("on"),2200);
}
cv.addEventListener("click", e=>{
  const rx=e.offsetX/cv.clientWidth*RW, ry=e.offsetY/cv.clientHeight*RH;
  const a=actors().find(a=>rx>=a.x-2 && rx<=a.x+width(a)+2 && ry>FLOOR-24);
  if(a){ celebrate(a); say(a, a===mascot ? LINES_M[Math.floor(Math.random()*LINES_M.length)] : (L=>L[Math.floor(Math.random()*L.length)])(LINES_G(a.name))); }
  else celebrate();
});

let last=performance.now()/1000;
function loop(){
  const t=performance.now()/1000, dt=Math.min(.1,t-last); last=t;
  drawRoom(t);
  actors().forEach(a=>{
    const w=width(a), lo=58, hi=RW-4-w;
    if(a.jump>0) a.jump-=dt; if(a.happy>0) a.happy-=dt;
    if(a.blink>0) a.blink-=dt; else if(Math.random()<dt*.5) a.blink=.15;
    if(a.pause>0) a.pause-=dt;
    else { a.x+=a.dir*dt*11; if(a.x<lo||a.x>hi){ a.dir*=-1; a.x=Math.max(lo,Math.min(hi,a.x)); } if(Math.random()<dt*.35) a.pause=1+Math.random()*2.5; if(Math.random()<dt*.15) a.dir*=-1; }
    const walking=a.pause<=0 && a.jump<=0, step=Math.floor(t*6);
    const jy=a.jump>0?Math.round(Math.sin((1-a.jump/.6)*Math.PI)*6):0, bob=walking&&step%2?1:0;
    const x=Math.round(a.x), y=FLOOR-16-Math.max(0,jy)+bob;
    if(a===mascot){ /* ほしのこは少し浮いている */
      const fy=Math.round(Math.sin(t*2.4)*1.5)+3;
      g.fillStyle="rgba(150,100,80,.14)"; g.fillRect(x+9,FLOOR,10,1);
      drawGrid(g, starSprite({t:step, blink:a.blink>0, happy:a.happy>0}), x, FLOOR-21-fy-Math.max(0,jy), a.dir<0);
      return;
    }
    g.fillStyle="rgba(150,100,80,.18)"; g.fillRect(x+5,FLOOR,10,1); if(lookOf(a.name).twins) g.fillRect(x+19,FLOOR,10,1);
    const L=lookOf(a.name), f={t:step, blink:a.blink>0, happy:a.happy>0, walk:walking};
    if(L.twins) drawGrid(g, sprite(Object.assign({},L,{c:"sky",head:"flower"}),{...f,t:step+1}), x+14, y+1, a.dir<0);
    drawGrid(g, sprite(L,f), x, y, a.dir<0);
  });
  parts=parts.filter(p=>(p.life-=dt)>0);
  parts.forEach(p=>{ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=6*dt; if(p.k==="h") pat(HEART,p.x,p.y,"#e79bb3"); else pat(SPARK,p.x,p.y,p.life%0.3<.15?"#ecc95f":"#fbeaa0"); });
  if(flutter>0) flutter-=dt;
  requestAnimationFrame(loop);
}

/* ========== BGM(オルゴール風。Web Audio で合成、ファイル不要) ========== */
const AU={ctx:null, on:false, next:0, step:0, timer:null, master:null};
const NT=n=>440*Math.pow(2,(n-69)/12); // MIDI番号→周波数
/* 1小節=8つ。0=休み。C=72 */
const MEL=[76,79,84,79,81,79,76,0, 77,81,84,81,79,76,74,0, 76,79,84,79,81,84,86,0, 84,79,76,74,72,0,0,0,
           81,0,79,0,77,79,81,0, 79,0,76,0,74,76,79,0, 81,84,83,81,79,77,76,74, 72,76,79,84,0,0,0,0];
const BASS=[48,55,53,48,48,55,55,48, 53,48,52,55,53,50,55,48];
function tone(f,t,dur,vol,type){
  const o=AU.ctx.createOscillator(), gn=AU.ctx.createGain(); o.type=type; o.frequency.value=f;
  gn.gain.setValueAtTime(0,t); gn.gain.linearRampToValueAtTime(vol,t+.008); gn.gain.exponentialRampToValueAtTime(.0005,t+dur);
  o.connect(gn); gn.connect(AU.master); o.start(t); o.stop(t+dur+.05);
}
function box(n,t,vol=.12){ tone(NT(n),t,1.1,vol,"sine"); tone(NT(n+12),t,.5,vol*.25,"triangle"); }
function schedule(){
  const spb=60/100/2; // 100BPM の8分音符
  while(AU.next < AU.ctx.currentTime+.4){
    const i=AU.step%MEL.length; if(MEL[i]) box(MEL[i],AU.next);
    if(i%4===0) tone(NT(BASS[(i/4)%BASS.length]),AU.next,1.2,.07,"triangle");
    AU.next+=spb; AU.step++;
  }
}
function bgmSet(on){
  AU.on=on; $("bgmBtn").textContent="♪ BGM "+(on?"ON":"OFF"); $("bgmBtn").classList.toggle("on",on);
  try{ localStorage.setItem("oekaki-bgm", on?"1":"0"); }catch(e){}
  if(on){
    if(!AU.ctx){ AU.ctx=new (window.AudioContext||window.webkitAudioContext)(); AU.master=AU.ctx.createGain(); AU.master.gain.value=.55; AU.master.connect(AU.ctx.destination); }
    AU.ctx.resume(); AU.next=AU.ctx.currentTime+.1; clearInterval(AU.timer); AU.timer=setInterval(schedule,100);
  } else { clearInterval(AU.timer); if(AU.ctx) AU.ctx.suspend(); }
}
function sfx(){ // ひいたときの「ぴろりん」(BGMがONのときだけ)
  if(!AU.on||!AU.ctx) return; const t=AU.ctx.currentTime+.02; [84,88,91,96].forEach((n,i)=>box(n,t+i*.07,.09));
}
$("bgmBtn").onclick=()=>bgmSet(!AU.on);
document.addEventListener("visibilitychange",()=>{ if(!AU.ctx||!AU.on) return; if(document.hidden) AU.ctx.suspend(); else { AU.ctx.resume(); AU.next=AU.ctx.currentTime+.1; } });
/* 前回ONなら、最初にどこかを押したときに鳴りはじめる(ブラウザは自動再生できないため) */
try{ if(localStorage.getItem("oekaki-bgm")==="1") document.addEventListener("pointerdown",e=>{ if(!AU.on && e.target.id!=="bgmBtn") bgmSet(true); },{once:true}); }catch(e){}

/* ========== 保存 ========== */
const KEY="oekaki-odai-v1";
function load(){
  try{ const s=localStorage.getItem(KEY); if(s){ const d=JSON.parse(s); if(d&&d.data) return d; } }catch(e){}
  return {data:JSON.parse(JSON.stringify(DEFAULTS)), hist:[]};
}
let state=load();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

/* ========== 画面操作 ========== */
const rand=a=>a[Math.floor(Math.random()*a.length)];
const genreName=g=>g==="all"?"共通":(GENRES.find(x=>x.id===g)||{}).name||g;
function toast(m){ const t=$("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(toast.h); toast.h=setTimeout(()=>t.classList.remove("show"),1500); }
function status(){
  $("stLeft").textContent = mode==="single" ? "♪ 会のテーマ" : mode==="genre" ? "♪ ジャンル: "+genreName(genre) : "♪ フリー(ぜんぶのジャンル)";
  $("stRight").textContent = "いる子: "+actors().map(a=>a.name).join("・");
}
function finished(){ sfx(); picSeed=(Math.random()*1e9)|0; picStart=performance.now()/1000; flutter=1; syncGuest(); celebrate(); status();
  const a=guest||mascot; say(a, guest ? LINES_G(guest.name)[0] : "きまったね!"); }

function pool(box){
  const list=state.data.items[box]||[];
  return (mode==="genre" ? list.filter(i=>i.g==="all"||i.g===genre) : list).map(i=>i.t);
}
function spin(setter, cands, done){
  if(!cands.length){ setter("(お題がありません)"); return; }
  let n=0; const iv=setInterval(()=>{ setter(rand(cands)); if(++n>=10){ clearInterval(iv); const v=rand(cands); setter(v); done&&done(v); } },55);
}
function addHist(t){ state.hist.unshift(t); state.hist=state.hist.slice(0,30); save(); renderHist(); }
function renderHist(){
  const ul=$("hist"); ul.innerHTML="";
  if(!state.hist.length){ const li=document.createElement("li"); li.textContent="まだありません"; ul.appendChild(li); return; }
  state.hist.forEach(h=>{ const li=document.createElement("li"); li.textContent=h; ul.appendChild(li); });
}
function setMode(m){
  mode=m;
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on", b.dataset.mode===m));
  $("view-single").classList.toggle("hide", m!=="single");
  $("view-mix").classList.toggle("hide", m==="single");
  $("genreCard").classList.toggle("hide", m!=="genre");
  $("boxCard").classList.toggle("hide", m==="single");
  renderSlots(); syncGuest(); status();
}
$("tabs").addEventListener("click", e=>{ const b=e.target.closest("button"); if(b) setMode(b.dataset.mode); });

$("singleBtn").onclick=()=>spin(v=>$("singleVal").textContent=v, state.data.single, v=>{ singleDone=true; addHist("【会のテーマ】"+v); finished(); });

function renderGenres(){
  const c=$("genreChips"); c.innerHTML="";
  GENRES.forEach(gn=>{ const b=document.createElement("button"); b.className="chip"+(gn.id===genre?" on":""); b.textContent=gn.name;
    b.onclick=()=>{ genre=gn.id; renderGenres(); renderSlots(); status(); }; c.appendChild(b); });
}
$("genreRandom").onclick=()=>{ genre=rand(GENRES).id; renderGenres(); renderSlots(); status(); toast("ジャンル: "+genreName(genre)); };
function renderBoxes(){
  const c=$("boxChips"); c.innerHTML="";
  BOXES.forEach(bx=>{ const b=document.createElement("button"); b.className="chip box"+(activeBoxes.has(bx.id)?" on":""); b.textContent=bx.name;
    b.onclick=()=>{ activeBoxes.has(bx.id)?activeBoxes.delete(bx.id):activeBoxes.add(bx.id); renderBoxes(); renderSlots(); syncGuest(); status(); }; c.appendChild(b); });
}
function renderSlots(){
  $("genreNow").textContent = mode==="genre" ? "★ "+genreName(genre)+" ★" : "★ フリー(ぜんぶのジャンル) ★";
  const w=$("slots"); w.innerHTML="";
  const act=BOXES.filter(b=>activeBoxes.has(b.id));
  if(!act.length){ w.textContent="つかう箱をえらんでね"; return; }
  act.forEach(bx=>{
    const row=document.createElement("div"); row.className="slot";
    const nm=document.createElement("div"); nm.className="name"; nm.textContent=bx.name;
    const val=document.createElement("div"); val.className="val"; val.id="val-"+bx.id; val.textContent=current[bx.id]||"―";
    const re=document.createElement("button"); re.className="ib"; re.textContent="🎲"; re.title="この箱だけひき直す";
    re.onclick=()=>{ if(locks.has(bx.id)) return; spin(v=>{ current[bx.id]=v; val.textContent=v; }, pool(bx.id), ()=>{ const t=mixText(); if(t) addHist(t); finished(); }); };
    const lk=document.createElement("button"); lk.className="ib"+(locks.has(bx.id)?" locked":""); lk.textContent="🔒"; lk.title="固定";
    lk.onclick=()=>{ locks.has(bx.id)?locks.delete(bx.id):locks.add(bx.id); lk.classList.toggle("locked"); };
    row.append(nm,val,re,lk); w.appendChild(row);
  });
}
function mixText(){
  const parts=BOXES.filter(b=>activeBoxes.has(b.id)&&current[b.id]).map(b=>b.name+"「"+current[b.id]+"」");
  return parts.length ? (mode==="genre"?"【"+genreName(genre)+"】":"【フリー】")+parts.join(" × ") : "";
}
$("mixBtn").onclick=()=>{
  const ts=BOXES.filter(b=>activeBoxes.has(b.id)&&!locks.has(b.id));
  if(!ts.length){ toast("ひける箱がありません"); return; }
  let remain=ts.length;
  ts.forEach(bx=>{ const el=$("val-"+bx.id);
    spin(v=>{ current[bx.id]=v; if(el) el.textContent=v; }, pool(bx.id), ()=>{ if(--remain===0){ const t=mixText(); if(t) addHist(t); finished(); } }); });
};
function copyNow(){
  const t = mode==="single" ? (singleDone ? "今日の会のテーマ🎨\n"+$("singleVal").textContent : "") : (mixText() ? "今日のお題🎨\n"+mixText() : "");
  if(!t){ toast("先にひいてね"); return; }
  (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(()=>toast("コピーしました ♪"), ()=>prompt("コピーしてください", t));
}
$("copy1").onclick=copyNow; $("copy2").onclick=copyNow;

$("resetBtn").onclick=()=>{ if(confirm("ふやした・へらしたお題が、ぜんぶはじめの状態に戻ります。よろしいですか?")){
  state.data=JSON.parse(JSON.stringify(DEFAULTS)); save(); renderEditorItems(); toast("はじめに戻しました"); } };

renderGenres(); renderBoxes(); renderSlots(); renderHist(); renderEditorSelects(); renderEditorItems(); setMode("single");
requestAnimationFrame(loop);
/* 公開版では「ふやす・へらす」を隠す(お題はレイがPCの原本に足して公開する)。URL の最後に #edit を付けると出る */
if(location.protocol!=="file:" && !location.hash.includes("edit")) $("editCard").classList.add("hide");
/* スマホアプリ(PWA): 一度開けば電波がなくても動く */
if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js");
</script>
